name: PR Check

on:
  pull_request:
    branches: ["master"]

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      RUMDL_VERSION: 0.1.25
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install rumdl
        run: curl -LsSf https://github.com/rvben/rumdl/releases/download/v${RUMDL_VERSION}/rumdl-v${RUMDL_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C /usr/local/bin
      - name: Install innsigle
        # Pinned to a tag. innsigle is not published on npm, so install from
        # the public repo. Verification uses public keys only - no secrets.
        run: npm i -g github:DocumentDrivenDX/innsigle#v0.6.1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify innsigle seals
        run: just verify-seals
      - name: Build
        run: just build
      - name: Lint
        run: just lint
